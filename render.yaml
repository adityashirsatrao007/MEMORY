services:
  - type: web
    name: memory-license-server
    serviceRoot: tools/license-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: memory-license-db
          property: connectionString
      - key: LICENSE_ADMIN_TOKEN
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: LICENSE_PUBLIC_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: adityashirsatrao007@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: adityashirsatrao007@gmail.com

databases:
  - name: memory-license-db
    plan: free
