services:
  - type: web
    name: memory-license-server
    serviceRoot: tools/license-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: memory-license-db
          property: connectionString
      - key: LICENSE_ADMIN_TOKEN
        sync: false
      - key: LICENSE_PRIVATE_KEY
        sync: false
      - key: LICENSE_PUBLIC_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: MEMORY <onboarding@resend.dev>
      - key: OWNER_EMAIL
        value: adityashirsatrao007@gmail.com

databases:
  - name: memory-license-db
    plan: free
